<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para vos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="floaters" aria-hidden="true">
    <span>💗</span><span>✨</span><span>💗</span><span>🤍</span><span>💗</span><span>✨</span>
  </div>

  <button class="btn centered" id="btn">Haz click</button>

  <section class="reveal hidden" id="reveal">
    <div class="letter">
      <div class="big-heart">💖</div>
      <p class="letter-text">TE AMO Y QUERÍA QUE LO SEPAS NADA MÁS Y PERDÓN POR LO PESADO QUE PUEDO SER</p>
      <p class="letter-ps">PD: No pienses demasiado, arriésgate, yo te haría la mujer más feliz del mundo</p>
      <p class="letter-signature">ATT: El hombre que quiere todo contigo</p>
    </div>
  </section>

<script src="script.js"></script>
</body>
</html>
